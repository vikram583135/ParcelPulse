spring.application.name=parcelpulse
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parcelpulse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
parcelpulse.upload-dir=./uploads

# Verification thresholds
parcelpulse.verification.min-time-gap-minutes=5
parcelpulse.verification.max-time-gap-minutes=120
parcelpulse.verification.min-gps-distance-km=0.5
parcelpulse.verification.max-gps-distance-km=30

# Rider economics (fixed for hackathon)
parcelpulse.reward.per-placement=10.00
parcelpulse.reward.completion-bonus=50.00
parcelpulse.reward.min-usage-percent=50
parcelpulse.discount.full-payment-percent=10
